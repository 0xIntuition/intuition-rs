input {
  beats {
    port => 5044
  }
}

filter {
  if [container] {
    mutate {
      add_field => { "container_name" => "%{[container][name]}" }
      add_field => { "container_id" => "%{[container][id]}" }
    }
  }
  
  # Parse JSON logs from your consumer applications
  if [message] =~ /^\{.*\}$/ {
    # Try to extract the first valid JSON object if multiple are present
    if [message] =~ /\}\s*\{/ {
      grok {
        match => { "message" => "(?<json_part>\{[^}]*\})" }
      }
      json {
        source => "json_part"
        skip_on_invalid_json => true
      }
    } else {
      json {
        source => "message"
        skip_on_invalid_json => true
      }
    }
  }
  
  # Add timestamp if not present
  if ![timestamp] {
    date {
      match => [ "@timestamp", "ISO8601" ]
    }
  }
  
  # Add service name based on container
  if [container][name] {
    mutate {
      add_field => { "service" => "%{[container][name]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "docker-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
