[package]
name = "consumer"
version = "2.0.7"
edition = "2024"

[dependencies]
clap = { version = "4.4.7", features = ["derive"] }
hex = "0.4.3"
hostname = "0.3"
sqlx-core = "0.8.6"

# Local dependencies
models = { path = "../models" }
shared-utils = { path = "../shared-utils" }

# Workspace dependencies
alloy.workspace = true
alloy-network.workspace = true
async-trait.workspace = true
base64 = "0.22"
bytes.workspace = true
dotenvy.workspace = true
envy.workspace = true
futures = "0.3.31"
once_cell = "1.20.2"
prometheus = "0.13.4"
regex = "1.11.1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing = "0.1"
macon.workspace = true
chrono.workspace = true
redis = { version = "0.32.4", features = ["tokio-comp", "connection-manager", "streams"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4"] }
warp = "0.3.7"

# We currently support two versions of the contract:
# - v1_5_contract: The latest version of the contract
# - v1_0_contract: The previous version of the contract
[features]
v1_5_contract = []
v1_0_contract = []
default = ["v1_0_contract"]