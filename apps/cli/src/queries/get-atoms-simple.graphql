query GetAtomsSimple($limit: Int, $offset: Int, $order_by: [atoms_order_by!], $where: atoms_bool_exp) {
  atoms(limit: $limit, offset: $offset, order_by: $order_by, where: $where) {
    term_id
    wallet_id
    creator_id
    data
    emoji
    label
    image
    type
    value_id
    block_number
    block_timestamp
    transaction_hash
  }
} 