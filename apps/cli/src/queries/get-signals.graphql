query GetSignals {
  signals(limit: 250, order_by: {created_at: desc}) {
    id
    created_at
    delta
    account {
      label
      type
    }
    term {
      id
      atom {
        emoji
        label
      }
      triple {
        subject {
          label
        }
        predicate {
          label
        }
        object {
          label
        }
      }
    }
    deposit {
      shares
    }
    redemption {
      receiver {
        label
      }
    }
  }
}

