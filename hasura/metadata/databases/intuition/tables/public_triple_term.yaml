table:
  name: triple_term
  schema: public
object_relationships:
  - name: counter_term
    using:
      foreign_key_constraint_on: counter_term_id
  - name: term
    using:
      foreign_key_constraint_on: term_id
select_permissions:
  - role: anonymous
    permission:
      columns:
        - counter_term_id
        - term_id
        - total_assets
        - total_market_cap
        - updated_at
      filter: {}
      limit: 250
    comment: ""
