type Query {
  getAccountPnlChart(
    input: GetAccountPnlChartInput!
  ): AccountPnlChartOutput
}

type Query {
  getAccountPnlCurrent(
    input: GetAccountPnlCurrentInput!
  ): AccountPnlSnapshotOutput
}

type Query {
  getAccountPnlRealized(
    input: GetAccountPnlRealizedInput!
  ): AccountPnlRealizedOutput
}

type Query {
  getChartJson(
    input: GetChartJsonInput!
  ): ChartDataOutput
}

type Query {
  getChartRawJson(
    input: GetChartJsonInput!
  ): ChartDataOutput
}

type Query {
  getChartRawSvg(
    input: GetChartSvgInput!
  ): ChartSvgOutput
}

type Query {
  getChartSvg(
    input: GetChartSvgInput!
  ): ChartSvgOutput
}

type Query {
  getPositionPnlChart(
    input: GetPositionPnlChartInput!
  ): PositionPnlChartOutput
}

type Mutation {
  pinOrganization(
    organization: PinOrganizationInput!
  ): PinOutput
}

type Mutation {
  pinPerson(
    person: PinPersonInput!
  ): PinOutput
}

type Mutation {
  pinThing(
    thing: PinThingInput!
  ): PinOutput
}

type Mutation {
  uploadImage(
    image: UploadImageInput!
  ): UploadImageFromUrlOutput
}

type Mutation {
  uploadImageFromUrl(
    image: UploadImageFromUrlInput!
  ): UploadImageFromUrlOutput
}

type Mutation {
  uploadJsonToIpfs(
    json: jsonb!
  ): UploadJsonToIpfsOutput
}

input PinThingInput {
  name: String
  description: String
  image: String
  url: String
}

input PinPersonInput {
  identifier: String
  name: String
  description: String
  image: String
  url: String
  email: String
}

input PinOrganizationInput {
  name: String
  description: String
  image: String
  url: String
  email: String
}

input PinJsonInput {
  json: jsonb
}

input UploadImageFromUrlInput {
  url: String!
}

input UploadImageInput {
  data: String!
  filename: String!
  contentType: String!
}

input GetChartJsonInput {
  term_id: String!
  curve_id: String!
  interval: String!
  start_time: String!
  end_time: String!
  graph_type: String
}

input GetChartSvgInput {
  term_id: String!
  curve_id: String!
  interval: String!
  start_time: String!
  end_time: String!
  graph_type: String
  width: Int
  height: Int
  line_color: String
  background_color: String
}

input GetPositionPnlChartInput {
  account_id: String!
  term_id: String!
  curve_id: String!
  interval: String!
  start_time: String!
  end_time: String!
}

input GetAccountPnlChartInput {
  account_id: String!
  interval: String!
  start_time: String!
  end_time: String!
}

input GetAccountPnlCurrentInput {
  account_id: String!
}

input GetAccountPnlRealizedInput {
  account_id: String!
  start_time: String!
  end_time: String!
}

type PinOutput {
  uri: String
}

type UploadImageFromUrlOutput {
  images: [CachedImage!]!
}

type CachedImage {
  url: String!
  original_url: String!
  score: jsonb
  model: String
  safe: Boolean!
  created_at: timestamptz!
}

type UploadJsonToIpfsOutput {
  name: String!
  hash: String!
  size: String!
}

type ChartDataOutput {
  term_id: String!
  curve_id: String
  graph_type: String!
  interval: String!
  count: Int!
  data: [ChartDataPoint!]!
}

type ChartDataPoint {
  timestamp: String!
  value: String!
}

type ChartSvgOutput {
  svg: String!
}

type PositionPnlChartOutput {
  account_id: String!
  term_id: String!
  curve_id: String!
  interval: String!
  count: Int!
  data: [PositionPnlChartPoint!]!
}

type PositionPnlChartPoint {
  timestamp: String!
  shares_total: String!
  share_price: String!
  equity_value: String!
  total_assets_in: String!
  total_assets_out: String!
  net_invested: String!
  total_pnl: String!
  pnl_pct: String!
  unrealized_pnl: String!
}

type AccountPnlChartOutput {
  account_id: String!
  interval: String!
  count: Int!
  data: [AccountPnlChartPoint!]!
}

type AccountPnlChartPoint {
  timestamp: String!
  equity_value: String!
  total_assets_in: String!
  total_assets_out: String!
  net_invested: String!
  total_pnl: String!
  pnl_pct: String!
  unrealized_pnl: String!
}

type AccountPnlSnapshotOutput {
  account_id: String!
  timestamp: String!
  equity_value: String!
  total_assets_in: String!
  total_assets_out: String!
  net_invested: String!
  total_pnl: String!
  pnl_pct: String!
  unrealized_pnl: String!
}

type AccountPnlRealizedOutput {
  account_id: String!
  count: Int!
  data: [AccountPnlRealizedEntry!]!
}

type AccountPnlRealizedEntry {
  timestamp: String!
  term_id: String!
  curve_id: String!
  shares_redeemed: String!
  assets_out: String!
  cost_basis: String!
  realized_pnl: String!
  realized_pnl_pct: String!
}

