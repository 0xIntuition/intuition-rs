type Mutation {
  pinOrganization(
    organization: PinOrganizationInput!
  ): PinOutput
}

type Mutation {
  pinPerson(
    person: PinPersonInput!
  ): PinOutput
}

type Mutation {
  pinThing(
    thing: PinThingInput!
  ): PinOutput
  uploadImageFromUrl(
    image: UploadImageFromUrlInput!
  ): UploadImageFromUrlOutput
  uploadJsonToIpfs(
    json: jsonb!
  ): UploadJsonToIpfsOutput
  uploadImage(
    image: UploadImageInput!
  ): UploadImageFromUrlOutput
}

input PinThingInput {
  name: String
  description: String
  image: String
  url: String
}

input PinPersonInput {
  identifier: String
  name: String
  description: String
  image: String
  url: String
  email: String
}

input PinOrganizationInput {
  name: String
  description: String
  image: String
  url: String
  email: String
}

input PinJsonInput {
  json: jsonb
}

input UploadImageFromUrlInput {
  url: String!
}

input UploadImageInput {
  data: String!
  filename: String!
  contentType: String!
}

type PinOutput {
  uri: String
}

type UploadImageFromUrlOutput {
  images: [CachedImage!]!
}

type CachedImage {
  url: String!
  original_url: String!
  score: jsonb
  model: String
  safe: Boolean!
  created_at: timestamptz!
}

type UploadJsonToIpfsOutput {
  name: String!
  hash: String!
  size: String!
}

type Query {
  getChartJson(
    input: GetChartJsonInput!
  ): ChartDataOutput
  getChartSvg(
    input: GetChartSvgInput!
  ): ChartSvgOutput
}

input GetChartJsonInput {
  term_id: String!
  curve_id: String!
  interval: String!
  start: String!
  end: String!
  graph_type: String
}

input GetChartSvgInput {
  term_id: String!
  curve_id: String!
  interval: String!
  start: String!
  end: String!
  graph_type: String
  width: Int
  height: Int
  line_color: String
  background_color: String
}

type ChartDataOutput {
  term_id: String!
  curve_id: String
  graph_type: String!
  interval: String!
  count: Int!
  data: [ChartDataPoint!]!
}

type ChartDataPoint {
  timestamp: String!
  value: String!
}

type ChartSvgOutput {
  svg: String!
}

