type Mutation {
  pinOrganization(
    organization: PinOrganizationInput!
  ): PinOutput
}

type Mutation {
  pinPerson(
    person: PinPersonInput!
  ): PinOutput
}

type Mutation {
  pinThing(
    thing: PinThingInput!
  ): PinOutput
  uploadImageFromUrl(
    image: UploadImageFromUrlInput!
  ): UploadImageFromUrlOutput
  uploadJsonToIpfs(
    json: jsonb!
  ): UploadJsonToIpfsOutput
}

input PinThingInput {
  name: String
  description: String
  image: String
  url: String
}

input PinPersonInput {
  identifier: String
  name: String
  description: String
  image: String
  url: String
  email: String
}

input PinOrganizationInput {
  name: String
  description: String
  image: String
  url: String
  email: String
}

input PinJsonInput {
  json: jsonb
}

input UploadImageFromUrlInput {
  url: String!
}

type PinOutput {
  uri: String
}

type UploadImageFromUrlOutput {
  images: [CachedImage!]!
}

type CachedImage {
  url: String!
  original_url: String!
  score: jsonb
  model: String
  safe: Boolean!
  created_at: timestamptz!
}

type UploadJsonToIpfsOutput {
  name: String!
  hash: String!
  size: String!
}

