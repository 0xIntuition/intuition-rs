actions:
  - name: pinOrganization
    definition:
      kind: synchronous
      handler: https://api.pinata.cloud/pinning/pinJSONToIPFS
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value_from_env: PINATA_AUTH
      request_transform:
        body:
          action: transform
          template: |-
            {
              "pinataOptions": {
                "cidVersion": 1
              },
              "pinataContent": {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "{{$body.input.organization.name}}",
                "description": "{{$body.input.organization.description}}",
                "image": "{{$body.input.organization.image}}",
                "url": "{{$body.input.organization.url}}",
                "email": "{{$body.input.organization.email}}"
              }
            }
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
            "uri": "ipfs://{{$body.IpfsHash}}"
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Uploads and pins Organization to IPFS
  - name: pinPerson
    definition:
      kind: synchronous
      handler: https://api.pinata.cloud/pinning/pinJSONToIPFS
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value_from_env: PINATA_AUTH
      request_transform:
        body:
          action: transform
          template: |-
            {
              "pinataOptions": {
                "cidVersion": 1
              },
              "pinataContent": {
                "@context": "https://schema.org",
                "@type": "Person",
                "identifier": "{{$body.input.person.identifier}}",
                "name": "{{$body.input.person.name}}",
                "description": "{{$body.input.person.description}}",
                "image": "{{$body.input.person.image}}",
                "url": "{{$body.input.person.url}}",
                "email": "{{$body.input.person.email}}"
              }
            }
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
            "uri": "ipfs://{{$body.IpfsHash}}"
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Uploads and pins Person to IPFS
  - name: pinThing
    definition:
      kind: synchronous
      handler: https://api.pinata.cloud/pinning/pinJSONToIPFS
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value_from_env: PINATA_AUTH
      request_transform:
        body:
          action: transform
          template: |-
            {
              "pinataOptions": {
                "cidVersion": 1
              },
              "pinataContent": {
                "@context": "https://schema.org",
                "@type": "Thing",
                "name": "{{$body.input.thing.name}}",
                "description": "{{$body.input.thing.description}}",
                "image": "{{$body.input.thing.image}}",
                "url": "{{$body.input.thing.url}}"
              }
            }
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
            "uri": "ipfs://{{$body.IpfsHash}}"
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Uploads and pins Thing to IPFS
  - name: uploadImageFromUrl
    definition:
      kind: synchronous
      handler: http://image-guard:3000/upload_image_from_url
      headers:
        - name: Content-Type
          value: application/json
      request_transform:
        body:
          action: transform
          template: |-
            {
              "url": "{{$body.input.image.url}}"
            }
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
              "images": {{$body}}
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Uploads and classifies an image from a URL using image-guard
  - name: uploadJsonToIpfs
    definition:
      kind: synchronous
      handler: http://image-guard:3000/upload_json_to_ipfs
      headers:
        - name: Content-Type
          value: application/json
      request_transform:
        body:
          action: transform
          template: |-
            {{$body.input.json}}
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
              "name": "{{$body.Name}}",
              "hash": "{{$body.Hash}}",
              "size": "{{$body.Size}}"
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Uploads JSON to IPFS using image-guard
  - name: uploadImage
    definition:
      kind: synchronous
      handler: http://image-guard:3000/upload_image_from_url
      forward_client_headers: false
      request_transform:
        body:
          action: transform
          template: |-
            {
              "url": "data:{{$body.input.image.contentType}};base64,{{$body.input.image.data}}"
            }
        content_type: application/json
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
              "images": {{$body}}
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: "Uploads and classifies an image file using image-guard. Accepts base64-encoded image data. Note: The original /upload endpoint requires multipart/form-data which Hasura actions cannot construct directly. This mutation uses upload_image_from_url with a data URL workaround. For direct file uploads, use the image-guard API directly or create a wrapper endpoint."
  - name: getChartJson
    definition:
      kind: synchronous
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        url: '{{$base_url}}/api/v1/curve/{{$body.input.input.curve_id}}/term/{{$body.input.input.term_id}}/data'
        query_params:
          interval: '{{$body.input.input.interval}}'
          format: 'json'
          start: '{{$body.input.input.start_time}}'
          end: '{{$body.input.input.end_time}}'
          graph_type: '{{$body.input.input?.graph_type}}'
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches chart data (JSON) for a term/curve combination
  - name: getChartSvg
    definition:
      kind: synchronous
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        url: '{{$base_url}}/api/v1/curve/{{$body.input.input.curve_id}}/term/{{$body.input.input.term_id}}/data'
        query_params:
          interval: '{{$body.input.input.interval}}'
          format: 'svg_json'
          start: '{{$body.input.input.start_time}}'
          end: '{{$body.input.input.end_time}}'
          graph_type: '{{$body.input.input?.graph_type}}'
          width: '{{$body.input.input?.width}}'
          height: '{{$body.input.input?.height}}'
          line_color: '{{$body.input.input?.line_color}}'
          background_color: '{{$body.input.input?.background_color}}'
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches chart SVG for a term/curve combination
  - name: getPositionPnlChart
    definition:
      kind: synchronous
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        url: '{{$base_url}}/api/v1/accounts/{{$body.input.input.account_id}}/positions/{{$body.input.input.term_id}}/{{$body.input.input.curve_id}}/pnl'
        query_params:
          interval: '{{$body.input.input.interval}}'
          start: '{{$body.input.input.start_time}}'
          end: '{{$body.input.input.end_time}}'
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches position PnL chart data
  - name: getAccountPnlChart
    definition:
      kind: synchronous
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        url: '{{$base_url}}/api/v1/accounts/{{$body.input.input.account_id}}/pnl'
        query_params:
          interval: '{{$body.input.input.interval}}'
          start: '{{$body.input.input.start_time}}'
          end: '{{$body.input.input.end_time}}'
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches account-level PnL chart data
  - name: getAccountPnlCurrent
    definition:
      kind: synchronous
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        url: '{{$base_url}}/api/v1/accounts/{{$body.input.input.account_id}}/pnl/current'
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches current account PnL snapshot
custom_types:
  enums: []
  input_objects:
    - name: PinThingInput
    - name: PinPersonInput
    - name: PinOrganizationInput
    - name: PinJsonInput
    - name: UploadImageFromUrlInput
    - name: UploadImageInput
    - name: GetChartJsonInput
    - name: GetChartSvgInput
    - name: GetPositionPnlChartInput
    - name: GetAccountPnlChartInput
    - name: GetAccountPnlCurrentInput
  objects:
    - name: PinOutput
    - name: UploadImageFromUrlOutput
    - name: CachedImage
    - name: UploadJsonToIpfsOutput
    - name: ChartDataOutput
    - name: ChartDataPoint
    - name: ChartSvgOutput
    - name: PositionPnlChartOutput
    - name: PositionPnlChartPoint
    - name: AccountPnlChartOutput
    - name: AccountPnlChartPoint
    - name: AccountPnlSnapshotOutput
  scalars: []
