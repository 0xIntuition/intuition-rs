actions:
  - name: getAccountPnlChart
    definition:
      kind: ""
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        query_params:
          end: '{{$body.input.input.end_time}}'
          interval: '{{$body.input.input.interval}}'
          start: '{{$body.input.input.start_time}}'
        template_engine: Kriti
        url: '{{$base_url}}/api/v1/accounts/{{$body.input.input.account_id}}/pnl'
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches account-level PnL chart data
  - name: getAccountPnlCurrent
    definition:
      kind: ""
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        template_engine: Kriti
        url: '{{$base_url}}/api/v1/accounts/{{$body.input.input.account_id}}/pnl/current'
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches current account PnL snapshot
  - name: getAccountPnlRealized
    definition:
      kind: ""
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        query_params:
          end: '{{$body.input.input.end_time}}'
          start: '{{$body.input.input.start_time}}'
        template_engine: Kriti
        url: '{{$base_url}}/api/v1/accounts/{{$body.input.input.account_id}}/pnl/realized'
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches realized PnL breakdown for an account
  - name: get_pnl_leaderboard_period
    definition:
      kind: ""
      handler: '{{chartApiUrl}}'
      timeout: 300
      request_transform:
        method: GET
        query_params:
          start: '{{$body.input.args.p_start_date}}'
          end: '{{$body.input.args.p_end_date}}'
          limit: '{{$body.input.args?.p_limit}}'
          offset: '{{$body.input.args?.p_offset}}'
          sort_by: '{{$body.input.args?.p_sort_by}}'
          sort_order: '{{$body.input.args?.p_sort_order}}'
          exclude_protocol_accounts: '{{$body.input.args?.p_exclude_protocol_accounts}}'
          min_positions: '{{$body.input.args?.p_min_positions}}'
          min_volume: '{{$body.input.args?.p_min_volume}}'
          term_id: '{{$body.input.args?.p_term_id}}'
        template_engine: Kriti
        url: '{{$base_url}}/api/v1/leaderboard/pnl/period'
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: PnL leaderboard for a period - proxied through chart-api with Redis caching
  - name: get_pnl_leaderboard_period_min_threshold
    definition:
      kind: ""
      handler: '{{chartApiUrl}}'
      timeout: 300
      request_transform:
        method: GET
        query_params:
          start: '{{$body.input.args.p_start_date}}'
          end: '{{$body.input.args.p_end_date}}'
          limit: '{{$body.input.args?.p_limit}}'
          offset: '{{$body.input.args?.p_offset}}'
          sort_by: '{{$body.input.args?.p_sort_by}}'
          sort_order: '{{$body.input.args?.p_sort_order}}'
          exclude_protocol_accounts: '{{$body.input.args?.p_exclude_protocol_accounts}}'
          min_positions: '{{$body.input.args?.p_min_positions}}'
          min_volume: '{{$body.input.args?.p_min_volume}}'
          term_id: '{{$body.input.args?.p_term_id}}'
          min_deposit: '{{$body.input.args?.p_min_deposit}}'
        template_engine: Kriti
        url: '{{$base_url}}/api/v1/leaderboard/pnl/period/min-threshold'
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: PnL leaderboard for a period with min deposit threshold - filters out low-stake positions
  - name: getChartJson
    definition:
      kind: ""
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        query_params:
          end: '{{$body.input.input.end_time}}'
          format: json
          graph_type: '{{$body.input.input?.graph_type}}'
          interval: '{{$body.input.input.interval}}'
          start: '{{$body.input.input.start_time}}'
        template_engine: Kriti
        url: '{{$base_url}}/api/v1/curve/{{$body.input.input.curve_id}}/term/{{$body.input.input.term_id}}/data'
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches chart data (JSON) for a term/curve combination
  - name: getChartRawJson
    definition:
      kind: ""
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        query_params:
          end: '{{$body.input.input.end_time}}'
          format: json
          interval: '{{$body.input.input.interval}}'
          start: '{{$body.input.input.start_time}}'
        template_engine: Kriti
        url: '{{$base_url}}/api/v1/curve/{{$body.input.input.curve_id}}/term/{{$body.input.input.term_id}}/data/raw'
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches raw share price chart data (JSON) from share_price_change
  - name: getChartRawSvg
    definition:
      kind: ""
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        query_params:
          background_color: '{{$body.input.input?.background_color}}'
          end: '{{$body.input.input.end_time}}'
          format: svg_json
          height: '{{$body.input.input?.height}}'
          interval: '{{$body.input.input.interval}}'
          line_color: '{{$body.input.input?.line_color}}'
          start: '{{$body.input.input.start_time}}'
          width: '{{$body.input.input?.width}}'
        template_engine: Kriti
        url: '{{$base_url}}/api/v1/curve/{{$body.input.input.curve_id}}/term/{{$body.input.input.term_id}}/data/raw'
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches raw share price chart SVG from share_price_change
  - name: getChartSvg
    definition:
      kind: ""
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        query_params:
          background_color: '{{$body.input.input?.background_color}}'
          end: '{{$body.input.input.end_time}}'
          format: svg_json
          graph_type: '{{$body.input.input?.graph_type}}'
          height: '{{$body.input.input?.height}}'
          interval: '{{$body.input.input.interval}}'
          line_color: '{{$body.input.input?.line_color}}'
          start: '{{$body.input.input.start_time}}'
          width: '{{$body.input.input?.width}}'
        template_engine: Kriti
        url: '{{$base_url}}/api/v1/curve/{{$body.input.input.curve_id}}/term/{{$body.input.input.term_id}}/data'
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches chart SVG for a term/curve combination
  - name: getPositionPnlChart
    definition:
      kind: ""
      handler: '{{chartApiUrl}}'
      request_transform:
        method: GET
        query_params:
          end: '{{$body.input.input.end_time}}'
          interval: '{{$body.input.input.interval}}'
          start: '{{$body.input.input.start_time}}'
        template_engine: Kriti
        url: '{{$base_url}}/api/v1/accounts/{{$body.input.input.account_id}}/positions/{{$body.input.input.term_id}}/{{$body.input.input.curve_id}}/pnl'
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Fetches position PnL chart data
  - name: pinOrganization
    definition:
      kind: synchronous
      handler: https://api.pinata.cloud/pinning/pinJSONToIPFS
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value_from_env: PINATA_AUTH
      request_transform:
        body:
          action: transform
          template: |-
            {
              "pinataOptions": {
                "cidVersion": 1
              },
              "pinataContent": {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "{{$body.input.organization.name}}",
                "description": "{{$body.input.organization.description}}",
                "image": "{{$body.input.organization.image}}",
                "url": "{{$body.input.organization.url}}",
                "email": "{{$body.input.organization.email}}"
              }
            }
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
            "uri": "ipfs://{{$body.IpfsHash}}"
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Uploads and pins Organization to IPFS
  - name: pinPerson
    definition:
      kind: synchronous
      handler: https://api.pinata.cloud/pinning/pinJSONToIPFS
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value_from_env: PINATA_AUTH
      request_transform:
        body:
          action: transform
          template: |-
            {
              "pinataOptions": {
                "cidVersion": 1
              },
              "pinataContent": {
                "@context": "https://schema.org",
                "@type": "Person",
                "identifier": "{{$body.input.person.identifier}}",
                "name": "{{$body.input.person.name}}",
                "description": "{{$body.input.person.description}}",
                "image": "{{$body.input.person.image}}",
                "url": "{{$body.input.person.url}}",
                "email": "{{$body.input.person.email}}"
              }
            }
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
            "uri": "ipfs://{{$body.IpfsHash}}"
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Uploads and pins Person to IPFS
  - name: pinThing
    definition:
      kind: synchronous
      handler: https://api.pinata.cloud/pinning/pinJSONToIPFS
      headers:
        - name: Content-Type
          value: application/json
        - name: Authorization
          value_from_env: PINATA_AUTH
      request_transform:
        body:
          action: transform
          template: |-
            {
              "pinataOptions": {
                "cidVersion": 1
              },
              "pinataContent": {
                "@context": "https://schema.org",
                "@type": "Thing",
                "name": "{{$body.input.thing.name}}",
                "description": "{{$body.input.thing.description}}",
                "image": "{{$body.input.thing.image}}",
                "url": "{{$body.input.thing.url}}"
              }
            }
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
            "uri": "ipfs://{{$body.IpfsHash}}"
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Uploads and pins Thing to IPFS
  - name: uploadImage
    definition:
      kind: synchronous
      handler: http://image-guard:3000/upload_image_from_url
      request_transform:
        body:
          action: transform
          template: |-
            {
              "url": "data:{{$body.input.image.contentType}};base64,{{$body.input.image.data}}"
            }
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
              "images": {{$body}}
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: 'Uploads and classifies an image file using image-guard. Accepts base64-encoded image data. Note: The original /upload endpoint requires multipart/form-data which Hasura actions cannot construct directly. This mutation uses upload_image_from_url with a data URL workaround. For direct file uploads, use the image-guard API directly or create a wrapper endpoint.'
  - name: uploadImageFromUrl
    definition:
      kind: synchronous
      handler: http://image-guard:3000/upload_image_from_url
      headers:
        - name: Content-Type
          value: application/json
      request_transform:
        body:
          action: transform
          template: |-
            {
              "url": "{{$body.input.image.url}}"
            }
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
              "images": {{$body}}
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Uploads and classifies an image from a URL using image-guard
  - name: uploadJsonToIpfs
    definition:
      kind: synchronous
      handler: http://image-guard:3000/upload_json_to_ipfs
      headers:
        - name: Content-Type
          value: application/json
      request_transform:
        body:
          action: transform
          template: '{{$body.input.json}}'
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |-
            {
              "name": "{{$body.Name}}",
              "hash": "{{$body.Hash}}",
              "size": "{{$body.Size}}"
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
      - role: frontend
    comment: Uploads JSON to IPFS using image-guard
custom_types:
  enums: []
  input_objects:
    - name: PinThingInput
    - name: PinPersonInput
    - name: PinOrganizationInput
    - name: PinJsonInput
    - name: UploadImageFromUrlInput
    - name: UploadImageInput
    - name: GetChartJsonInput
    - name: GetChartSvgInput
    - name: GetPositionPnlChartInput
    - name: GetAccountPnlChartInput
    - name: GetAccountPnlCurrentInput
    - name: GetAccountPnlRealizedInput
    - name: get_pnl_leaderboard_period_args
    - name: get_pnl_leaderboard_period_min_threshold_args
  objects:
    - name: PinOutput
    - name: UploadImageFromUrlOutput
    - name: CachedImage
    - name: UploadJsonToIpfsOutput
    - name: ChartDataOutput
    - name: ChartDataPoint
    - name: ChartSvgOutput
    - name: PositionPnlChartOutput
    - name: PositionPnlChartPoint
    - name: AccountPnlChartOutput
    - name: AccountPnlChartPoint
    - name: AccountPnlSnapshotOutput
    - name: AccountPnlRealizedOutput
    - name: AccountPnlRealizedEntry
    - name: PnlLeaderboardEntryOutput
  scalars: []
