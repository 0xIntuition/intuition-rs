table:
  name: vault
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: vaults
  custom_root_fields:
    select_by_pk: vault
object_relationships:
  - name: term
    using:
      foreign_key_constraint_on: term_id
array_relationships:
  - name: deposits
    using:
      manual_configuration:
        column_mapping:
          curve_id: curve_id
          term_id: term_id
        insertion_order: null
        remote_table:
          name: deposit
          schema: public
  - name: positions
    using:
      manual_configuration:
        column_mapping:
          curve_id: curve_id
          term_id: term_id
        insertion_order: null
