table:
  name: deposit
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: deposits
  custom_root_fields:
    select_by_pk: deposit
object_relationships:
  - name: receiver
    using:
      manual_configuration:
        column_mapping:
          receiver_id: id
        insertion_order: null
        remote_table:
          name: account
          schema: public
  - name: sender
    using:
      manual_configuration:
        column_mapping:
          sender_id: id
        insertion_order: null
        remote_table:
          name: account
          schema: public
  - name: term
    using:
      manual_configuration:
        column_mapping:
          term_id: id
        insertion_order: null
        remote_table:
          name: term
          schema: public
  - name: vault
    using:
      manual_configuration:
        column_mapping:
          curve_id: curve_id
          term_id: term_id
        insertion_order: null
        remote_table:
          name: vault
          schema: public
select_permissions:
  - role: anonymous
    permission:
      columns:
        - vault_type
        - log_index
        - term_id
        - assets_after_fees
        - block_number
        - curve_id
        - shares
        - total_shares
        - id
        - receiver_id
        - sender_id
        - transaction_hash
        - created_at
      filter: {}
      limit: 250
      allow_aggregations: true
    comment: ""
