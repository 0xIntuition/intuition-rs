table:
  name: subject_predicate
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: subject_predicates
  custom_root_fields: {}
object_relationships:
  - name: predicate
    using:
      foreign_key_constraint_on: predicate_id
  - name: subject
    using:
      foreign_key_constraint_on: subject_id
select_permissions:
  - role: anonymous
    permission:
      columns:
        - id
        - predicate_id
        - subject_id
        - total_market_cap
        - total_position_count
        - triple_count
      filter: {}
      limit: 250
      allow_aggregations: true
    comment: ""
