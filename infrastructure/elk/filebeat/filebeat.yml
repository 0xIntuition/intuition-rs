filebeat.inputs:
- type: container
  paths:
    - '/var/lib/docker/containers/*/*.log'
  processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
  - add_fields:
      fields:
        service: ${data.docker.container.name}
        level: INFO

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
