[package]
name = "migration-scripts"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "bigdecimal"] }
models = { path = "../models" }
alloy-primitives = "0.1"
serde = { version = "1.0", features = ["derive"] } 