services:

  
  resolver_consumer:
    image: ghcr.io/0xintuition/apps:latest
    command: ./consumer --mode resolver
    environment:
      AWS_ACCESS_KEY_ID: 'example'
      AWS_REGION: 'us-west-2'
      AWS_SECRET_ACCESS_KEY: 'example'
      CONSUMER_TYPE: 'redis_streams'
      DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      ENS_CONTRACT_ADDRESS: '0x00000000000C2E074eC69A0dFb2997BA6C7d2e1e'
      IMAGE_GUARD_URL: 'http://api:3000'
      IPFS_GATEWAY_URL: 'http://ipfs:8080'
      IPFS_UPLOAD_URL: 'http://ipfs:5001'
      IPFS_UPLOAD_STREAM: 'ipfs_upload_stream'
      # LOCALSTACK_URL: 'http://sqs:4566/'
      PINATA_API_JWT: $PINATA_API_JWT
      PINATA_GATEWAY_TOKEN: $PINATA_GATEWAY_TOKEN
      PG_MIN_CONNECTIONS: '5'
      RESOLVER_STREAM: 'resolver_stream'
      RPC_URL_BASE: "http://geth:8545"
      RPC_URL_MAINNET: "http://prod-rpc-proxy:3008/1/proxy"
      RUST_LOG: 'info'
      BACKEND_SCHEMA: 'public'
      REDIS_URL: 'redis://redis:6379'
    restart: always
    volumes:
      - ~/.aws/:/root/.aws:ro
      - ./logs:/app/logs
    deploy:
      replicas: 1

  
  ipfs_upload_consumer:
    image: ghcr.io/0xintuition/apps:latest
    command: ./consumer --mode ipfs-upload
    environment:
      AWS_ACCESS_KEY_ID: 'example'
      AWS_REGION: 'us-west-2'
      AWS_SECRET_ACCESS_KEY: 'example'
      CONSUMER_TYPE: 'redis_streams'
      DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      IMAGE_GUARD_URL: 'http://api:3000'
      IPFS_GATEWAY_URL: 'http://ipfs:8080'
      IPFS_UPLOAD_URL: 'http://ipfs:5001'
      # LOCALSTACK_URL: 'http://sqs:4566/'
      PINATA_API_JWT: $PINATA_API_JWT
      PINATA_GATEWAY_TOKEN: $PINATA_GATEWAY_TOKEN
      PG_MIN_CONNECTIONS: '5'
      IPFS_UPLOAD_STREAM: 'ipfs_upload_stream'
      RUST_LOG: 'info'
      BACKEND_SCHEMA: 'public'
      REDIS_URL: 'redis://redis:6379'
    restart: always
    volumes:
      - ~/.aws/:/root/.aws:ro
      - ./logs:/app/logs
    deploy:
      replicas: 2
    
  decoded_consumer:
    container_name: decoded_consumer
    image: ghcr.io/0xintuition/apps:latest
    command: ./consumer --mode decoded
    environment:
      AWS_ACCESS_KEY_ID: 'example'
      AWS_REGION: 'us-west-2'
      AWS_SECRET_ACCESS_KEY: 'example'
      CONSUMER_TYPE: 'redis_hybrid'
      INDEXER_DATABASE_URL: "postgres://postgres:postgres@database:5435/storage"
      INDEXER_SCHEMA: $INDEXER_SCHEMA
      ENVIRONMENT_NAME: "local_development"
      THREADS: '5'
      INITIAL_CONTRACT_VERSION: $INITIAL_CONTRACT_VERSION
      CONSUMER_METRICS_API_PORT: '3002'
      DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      DECODED_LOGS_STREAM: 'decoded_logs_stream'
      INTUITION_CONTRACT_ADDRESS: $INTUITION_CONTRACT_ADDRESS
      LOCALSTACK_URL: 'http://redis:6379'
      PG_MIN_CONNECTIONS: '20'
      RESOLVER_STREAM: 'resolver_stream'
      RPC_URL_BASE: "http://geth:8545"
      RUST_LOG: 'warn'
      BACKEND_SCHEMA: 'public'
      REDIS_URL: 'redis://redis:6379'
    restart: always
    volumes:
      - ~/.aws/:/root/.aws:ro
      - ./logs:/app/logs
    ports:
      - 3002:3002

    
  api:
    container_name: api
    image: ghcr.io/0xintuition/apps:latest
    command: ./image-guard
    environment:
      CLASSIFICATION_API_PORT: '3000'
      DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      HF_TOKEN: ''
      IPFS_GATEWAY_URL: 'http://ipfs:8080'
      IPFS_UPLOAD_URL: 'http://ipfs:5001'
      PINATA_API_JWT: $PINATA_API_JWT
      RUST_LOG: 'info'
      FLAG_LOCAL_WITH_CLASSIFICATION: 'true'
      BE_SCHEMA: 'public'
      IMAGE_API_SCHEMA: 'cached_images'
      INDEXER_DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      # FLAG_LOCAL_WITH_DB_ONLY: $FLAG_LOCAL_WITH_DB_ONLY
      # FLAG_HF_CLASSIFICATION: $FLAG_HF_CLASSIFICATION 
    ports:
      - 3000:3000
    
  prod-rpc-proxy:
    container_name: prod-rpc-proxy
    image: ghcr.io/0xintuition/apps:latest
    command: ./rpc-proxy
    environment:
      PROXY_DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      PROXY_API_PORT: '3008'
      PROXY_SCHEMA: "rpc_proxy"
      BASE_MAINNET_RPC_URL: $BASE_MAINNET_RPC_URL
      BASE_SEPOLIA_RPC_URL: $BASE_SEPOLIA_RPC_URL
      ETHEREUM_MAINNET_RPC_URL: $ETHEREUM_MAINNET_RPC_URL
      LINEA_MAINNET_RPC_URL: $LINEA_MAINNET_RPC_URL
      LINEA_SEPOLIA_RPC_URL: $LINEA_SEPOLIA_RPC_URL
      RUST_LOG: 'info'
    restart: always
    ports:
      - 3008:3008
  
  histocrawler:
    container_name: histocrawler
    image: ghcr.io/0xintuition/apps:latest
    command: ./histocrawler
    environment:
      HISTOCRAWLER_DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      INDEXER_SCHEMA: $INDEXER_SCHEMA
    depends_on:
      prod-rpc-proxy:
        condition: service_started

  integration-tests:
    container_name: integration-tests
    build:
      context: ./integration-tests
      dockerfile: Dockerfile
    environment:
      - ETHEREUM_RPC_URL=http://geth:8545
      - GRAPHQL_API_URL=http://graphql-engine:8080/v1/graphql
      - IPFS_API_URL=http://api:3000/upload_json_to_ipfs 
      - VITE_INTUITION_CONTRACT_ADDRESS=$INTUITION_CONTRACT_ADDRESS
    # depends_on:
    #   geth:
    #     condition: service_healthy
    #   graphql-engine:
    #     condition: service_healthy
    #   consumer-api:
    #     condition: service_started



networks:
  intuition-be:
    driver: bridge
    
volumes:
  raw_consumer:
  decoded_consumer: