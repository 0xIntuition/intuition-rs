name: Build image-guard image

# Builds and publishes ghcr.io/0xintuition/image-guard:<version> as a multi-arch image.
# Each platform is built natively on a GitHub-hosted runner of that architecture and
# pushed by digest; a final job merges the digests into the versioned tag.
#
# Usage: gh workflow run build-image-guard.yml --ref v2_0 -f version=2.1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (e.g. 2.1.0; must match apps/image-guard/Cargo.toml)"
        required: true
        type: string
      also_latest:
        description: "Also move the :latest tag"
        required: false
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/0xintuition/image-guard

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches the crate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate=$(grep -m1 '^version' apps/image-guard/Cargo.toml | cut -d'"' -f2)
          if [ "$crate" != "$VERSION" ]; then
            echo "::error::version $VERSION does not match apps/image-guard/Cargo.toml ($crate)"
            exit 1
          fi

      - name: Platform slug
        id: slug
        run: echo "value=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/image-guard/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-guard-${{ steps.slug.outputs.value }}
          cache-to: type=gha,mode=max,scope=image-guard-${{ steps.slug.outputs.value }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.slug.outputs.value }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tag
        working-directory: /tmp/digests
        env:
          VERSION: ${{ inputs.version }}
          ALSO_LATEST: ${{ inputs.also_latest }}
        run: |
          tags=(-t "${IMAGE}:${VERSION}")
          if [ "$ALSO_LATEST" = "true" ]; then tags+=(-t "${IMAGE}:latest"); fi
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Verify
        env:
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
