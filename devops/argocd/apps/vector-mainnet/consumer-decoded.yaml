apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: consumer-decoded-vector-mainnet
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - cluster: prod-eks
            server: 'https://kubernetes.default.svc'
            revision: next
            env: prod-base-mainnet-v-1-5-vector-final
            namespace: prod-base-mainnet-v-1-5-vector
            rpcURL: 'http://prod-rpc-proxy.default.svc.cluster.local:3008/8453/proxy'
  template:
    metadata:
      name: '{{.cluster}}-consumer-decoded-{{.namespace}}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '.;/devops/argocd'
    spec:
      project: default
      source:
        repoURL: https://github.com/0xintuition/intuition-rs.git
        path: 'devops/aws-rolling-releases/consumers/overlays/{{.env}}/decoded'
        targetRevision: '{{.revision}}'
        kustomize:
          patches:
            - target:
                kind: Queue
                name: resolver-queue
              patch: |-
                - op: replace
                  path: /metadata/name
                  value: '{{.namespace}}-resolver'
                - op: replace
                  path: /spec/forProvider/name
                  value: '{{.cluster}}-{{.namespace}}-resolver'
            - target:
                kind: Deployment
                name: decoded-consumer
              patch: |-
                - op: replace
                  path: /spec/template/spec/serviceAccountName
                  value: '{{.cluster}}-{{.namespace}}-secrets-access-sa'
                - op: add
                  path: /spec/template/spec/containers/0/envFrom/-
                  value:
                    secretRef:
                      name: 'main-db-creds'
                    prefix: "MAINDB_"
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: INDEXER_DATABASE_URL
                    value: 'postgres://$(MAINDB_username):$(MAINDB_password)@$(MAINDB_endpoint)/histoflux?sslmode=require'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: BACKEND_SCHEMA
                    value: 'public' # not sure if needs to be templated
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: ENVIRONMENT_NAME
                    value: 'base_mainnet_upgradeable'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: INDEXER_SCHEMA
                    value: 'histo_base_mainnet_1_0'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: CONSUMER_TYPE
                    value: 'sqs_hibrid'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: INTUITION_CONTRACT_ADDRESS
                    value: '0x430BbF52503Bd4801E51182f4cB9f8F534225DE5'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: THREADS
                    value: '4'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: CONSUMER_METRICS_API_PORT
                    value: '3002'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: RESOLVER_QUEUE_URL
                    value: 'https://sqs.us-west-2.amazonaws.com/064662847354/{{.cluster}}-{{.namespace}}-resolver'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: DECODED_LOGS_QUEUE_URL
                    value: 'https://sqs.us-west-2.amazonaws.com/064662847354/{{.cluster}}-{{.namespace}}-decoded-logs.fifo'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: RPC_URL_BASE
                    value: '{{.rpcURL}}' # probably better to have all of that dynamically created

      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
