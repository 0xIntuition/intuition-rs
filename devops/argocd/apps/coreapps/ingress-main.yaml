apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-main
  namespace: argocd
spec:
  project: prod
  source:
    repoURL: 'https://github.com/0xintuition/intuition-rs.git'
    targetRevision: luis/eng-6560-create-a-new-consumer-to-ingest-v1-data-in-v15-fomat-from
    path: devops/argocd/manifests/ingress-main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
