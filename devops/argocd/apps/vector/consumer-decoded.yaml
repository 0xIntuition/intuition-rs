apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: consumer-decoded
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - cluster: prod-eks
            server: 'https://kubernetes.default.svc'
            revision: luis/eng-6560-create-a-new-consumer-to-ingest-v1-data-in-v15-fomat-from
            env: prod-base-sepolia-v-1-5-final
            namespace: prod-base-sepolia-v1-5-vector
            rpcURL: 'http://prod-rpc-proxy.default.svc.cluster.local:3008/84532/proxy'
  template:
    metadata:
      name: '{{.cluster}}-consumer-decoded-{{.namespace}}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '.;/devops/argocd'
    spec:
      project: default
      source:
        repoURL: https://github.com/0xintuition/intuition-rs.git
        path: 'devops/aws-rolling-releases/consumers/overlays/{{.env}}/decoded'
        targetRevision: '{{.revision}}'
        kustomize:
          patches:
            - target:
                kind: Queue
                name: resolver-queue
              patch: |-
                - op: replace
                  path: /metadata/name
                  value: '{{.namespace}}-resolver'
                - op: replace
                  path: /spec/forProvider/name
                  value: '{{.cluster}}-{{.namespace}}-resolver'
            - target:
                kind: Deployment
                name: decoded-consumer
              patch: |-
                - op: replace
                  path: /spec/template/spec/serviceAccountName
                  value: '{{.cluster}}-{{.namespace}}-secrets-access-sa'
                - op: add
                  path: /spec/template/spec/containers/0/envFrom/-
                  value:
                    secretRef:
                      name: 'main-db-creds'
                    prefix: "MAINDB_"
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: BACKEND_SCHEMA
                    value: 'public' # not sure if needs to be templated
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: CONSUMER_TYPE
                    value: 'sqs_hibrid'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: INTUITION_CONTRACT_ADDRESS
                    value: '0x1A6950807E33d5bC9975067e6D6b5Ea4cD661665'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: THREADS
                    value: '3'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: CONSUMER_METRICS_API_PORT
                    value: '3008'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: RESOLVER_QUEUE_URL
                    value: 'https://sqs.us-west-2.amazonaws.com/064662847354/{{.cluster}}-{{.namespace}}-resolver'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: DECODED_LOGS_QUEUE_URL
                    value: 'https://sqs.us-west-2.amazonaws.com/064662847354/{{.cluster}}-{{.namespace}}-decoded-logs.fifo'
                - op: add
                  path: /spec/template/spec/containers/0/env/-
                  value:
                    name: RPC_URL_BASE
                    value: '{{.rpcURL}}' # probably better to have all of that dynamically created

      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
