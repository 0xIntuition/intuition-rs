apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: timescaledb-aws-secrets
spec:
  provider: aws
  parameters:
    region: "us-west-2"
    objects: |
      - objectName: "prod-base-mainnet-rr"
        objectType: "secretsmanager"
        objectVersionLabel: "AWSCURRENT"
        jmesPath:
          - path: POSTGRES_PASSWORD
            objectAlias: POSTGRES_PASSWORD
          - path: POSTGRES_USER
            objectAlias: POSTGRES_USER
          - path: POSTGRES_DB
            objectAlias: POSTGRES_DB
          - path: OPENAI_API_KEY
            objectAlias: OPENAI_API_KEY
          - path: DATABASE_URL
            objectAlias: POSTGRES_URL
  secretObjects:
    - secretName: "timescaledb-aws-secrets"
      type: Opaque
      data:
        - objectName: POSTGRES_PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: POSTGRES_USER
          key: POSTGRES_USER
        - objectName: POSTGRES_DB
          key: POSTGRES_DB
        - objectName: OPENAI_API_KEY
          key: OPENAI_API_KEY
        - objectName: POSTGRES_URL
          key: POSTGRES_URL