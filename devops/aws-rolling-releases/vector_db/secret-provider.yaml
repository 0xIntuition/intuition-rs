apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: prod-sepolia-vector-db-aws-secrets
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "prod-base-sepolia-v-1-5-vector-aws-secrets"
        objectType: "secretsmanager"
        jmesPath:
          - path: POSTGRES_PASSWORD
            objectAlias: POSTGRES_PASSWORD
          - path: POSTGRES_USER
            objectAlias: POSTGRES_USER
          - path: POSTGRES_DB
            objectAlias: POSTGRES_DB
  secretObjects:
    - secretName: "prod-base-sepolia-v-1-5-vector-aws-secrets"
      type: Opaque
      data:
        - objectName: POSTGRES_PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: POSTGRES_USER
          key: POSTGRES_USER
        - objectName: POSTGRES_DB
          key: POSTGRES_DB
