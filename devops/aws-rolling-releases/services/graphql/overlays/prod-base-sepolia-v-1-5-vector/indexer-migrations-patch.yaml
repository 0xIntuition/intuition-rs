apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-and-cache-migration
spec:
  template:
    spec:
      serviceAccountName: secrets-access-sa
      containers:
        - name: indexer-and-cache-migration
          image: ghcr.io/0xintuition/indexer-and-cache-migrations:2.0.16-v15
          imagePullPolicy: Always
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets"
              readOnly: true
          envFrom:
            - secretRef:
                name: prod-base-sepolia-v-1-5-vector-hasura
          env:
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@vector-db:5435/$(POSTGRES_DB)"
            - name: HASURA_GRAPHQL_METADATA_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@vector-db:5435/$(POSTGRES_DB)"
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "prod-base-sepolia-v-1-5-vector-hasura"
      restartPolicy: Never 